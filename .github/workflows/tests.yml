name: API Tests CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests playwright
        playwright install chromium

    - name: Run API Tests
      run: |
        cd laba4/tests
        pytest test_api.py -v --junitxml=report-api.xml

    - name: Run UI Tests (Smoke)
      run: |
        cd laba3/tests
        pytest test_registration.py -v --junitxml=report-ui.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          laba4/tests/report-api.xml
          laba3/tests/report-ui.xml
